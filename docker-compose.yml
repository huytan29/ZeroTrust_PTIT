services:
  ztas:
    build:
      context: .
    container_name: ztas
    environment:
      OPA_HOST: opa
    expose:
      - "8020"
    depends_on:
      - opa

  nginx:
    image: nginx:alpine
    container_name: ztas-nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ztas
  
  opa:
    image: openpolicyagent/opa:1.5.1-static
    container_name: ztas-opa
    command: run --server --addr=0.0.0.0:8181 /policies
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro
